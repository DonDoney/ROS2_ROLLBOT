# =============================================================================
# kinematics.yaml — Solucionador de cinemática inversa (IK) de MoveIt
# =============================================================================
# La IK calcula qué ángulos de articulación ponen la herramienta (tool0) en una
# posición y orientación concretas. KDL es el solucionador numérico genérico
# que viene con MoveIt; funciona con cualquier brazo serie.
# Alternativas más rápidas/robustas: TRAC-IK o pick_ik (instalables con apt).
# =============================================================================
brazo:                                   # nombre del grupo definido en brazo.srdf
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05        # segundos máximos por intento
