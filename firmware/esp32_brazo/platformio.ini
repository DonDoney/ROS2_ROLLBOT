; =============================================================================
; platformio.ini — Proyecto PlatformIO del firmware del brazo
; =============================================================================
; Compilar y cargar (con la placa conectada por USB):
;     pio run -t upload
; Abrir el monitor serie:
;     pio device monitor
; Desde VS Code: instala la extensión "PlatformIO IDE" y abre esta carpeta.
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev                ; ESP32 DevKit V1 / ESP32-WROOM-32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Librería que genera los pulsos STEP con los periféricos del ESP32
; (fija una versión concreta cuando tengas el sistema funcionando, p. ej. @0.31.x)
lib_deps =
    gin66/FastAccelStepper
